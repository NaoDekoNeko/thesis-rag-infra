name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read
  id-token: write       # necesario para OIDC
  pull-requests: write  # para postear plan como comentario en PRs

env:
  TF_VERSION: "1.15.2"
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ secrets.GCP_REGION }}
  TF_VAR_microservice_image: ${{ secrets.MICROSERVICE_IMAGE }}
  TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluar usuario autorizado
        id: authz
        run: |
          if [ "${{ github.actor }}" = "NaoDekoNeko" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Usuario autorizado para ejecuciones con permisos de despliegue."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Se omitirán los pasos con permisos de despliegue para ${{ github.actor }}."
          fi

      - name: Autenticar en GCP (OIDC)
        if: steps.authz.outputs.allowed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -input=false

      - name: terraform validate
        id: validate
        run: terraform validate

      - name: terraform plan
        id: plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event_name == 'push'
        run: terraform plan -out=tfplan -input=false
        env:
          TF_VAR_github_org: ${{ github.repository_owner }}

      - name: Publicar plan en PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan \`${{ steps.plan.outcome }}\`

            <details><summary>Ver plan</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Ejecutado por @${{ github.actor }} en \`${{ github.ref_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: terraform apply
        if: steps.authz.outputs.allowed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve -input=false

      - name: terraform destroy
        if: steps.authz.outputs.allowed == 'true' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_github_org: ${{ github.repository_owner }}

      - name: Exportar outputs al job summary
        if: steps.authz.outputs.allowed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.action == 'apply')
        run: |
          echo "## Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          terraform output -json | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value)"' >> $GITHUB_STEP_SUMMARY
