name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read
  id-token: write # necesario para OIDC

env:
  TF_VERSION: "1.15.2"
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ secrets.GCP_REGION }}
  TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.apply.outcome }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluar usuario autorizado
        id: authz
        run: |
          if [ "${{ github.actor }}" = "NaoDekoNeko" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Usuario autorizado para ejecuciones con permisos de despliegue."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Se omitirán los pasos con permisos de despliegue para ${{ github.actor }}."
          fi

      - name: Autenticar en GCP (OIDC)
        if: steps.authz.outputs.allowed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -input=false

      - name: terraform validate
        id: validate
        run: terraform validate

      - name: terraform plan
        id: plan
        if: github.event.inputs.action == 'plan' || github.event_name == 'push'
        run: terraform plan -out=tfplan -input=false
        env:
          TF_VAR_github_org: ${{ github.repository_owner }}

      - name: terraform apply
        id: apply
        if: steps.authz.outputs.allowed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve -input=false

      - name: terraform destroy
        if: steps.authz.outputs.allowed == 'true' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_github_org: ${{ github.repository_owner }}

      - name: Exportar outputs al job summary
        if: steps.authz.outputs.allowed == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.action == 'apply')
        run: |
          echo "## Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          terraform output -json | jq -r 'to_entries[] | select(.value.sensitive != true) | "- **\(.key)**: \(.value.value)"' >> $GITHUB_STEP_SUMMARY

  propagate-secrets:
    name: Propagar GitHub Secrets a repos dependientes
    needs: terraform
    if: needs.terraform.outputs.applied == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar en GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -input=false

      - name: Generar token de la GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: thesis-rag-infra,thesis-rag-microservice,thesis-doc-test-1,thesis-doc-test-2

      - name: Propagar GitHub Secrets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/set-github-secrets.sh
